# ==============================================================================
# SERVER CONFIGURATION
# ==============================================================================
spring.docker.compose.enabled=false
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api/v1

# ==============================================================================
# DATASOURCE CONFIGURATION (PostgreSQL / Supabase IPv4 Pooler)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.mldmvunntruvalmdglif}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Jotinha#13@4}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# SPRING AI & GOOGLE GEMINI CONFIGURATION
# ==============================================================================
spring.profiles.include=local
spring.ai.gemini.api-key=${SPRING_AI_GEMINI_API_KEY:}
spring.ai.gemini.chat.options.model=gemini-3.5-flash
spring.ai.gemini.chat.options.temperature=0.2

# Spring AI connecting to Google AI Studio Gemini API
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${spring.ai.gemini.api-key}
spring.ai.openai.chat.options.model=gemini-3.5-flash
spring.ai.openai.chat.options.temperature=${spring.ai.gemini.chat.options.temperature}

# ==============================================================================
# CORS CONFIGURATION (Local Development)
# ==============================================================================
application.cors.allowed-origins=http://localhost:4200
