name: Keep Render Backend Awake

on:
  schedule:
    # Executa a cada 10 minutos para garantir que o Render nunca adormece (sleep aos 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Ping Endpoint
        run: |
          echo "A enviar ping ao backend no Render..."
          curl -s -f -m 30 https://ai-workout-architect.onrender.com/api/v1/auth/ping || echo "Backend a acordar..."
